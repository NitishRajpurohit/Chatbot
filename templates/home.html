<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placement Predictor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="https://unpkg.com/dropzone@5/dist/min/dropzone.min.css" type="text/css" />
</head>

<body style="background-color: rgb(0, 137, 211);">
    <h2>
        <div class="p-3 text-primary-emphasis bg-primary-subtle border border-primary-subtle rounded-3 text-center">
            Verify,Will Your Knowledge Make You Placed
        </div>
    </h2>
    <div class="container">
        <form>
            <div class="row mb-3">
                <label for="age" class="col-sm-2 col-form-label fw-bold">Enter Your Age</label>
                <div class="col-sm-5">
                    <input type="number" class="form-control" name='ages' id="age" required>
                </div>
            </div>
            <fieldset class="row mb-3">
                <legend class="col-form-label col-sm-3 pt-0 fw-bold">Sector In Which You Are Interested</legend>
                <div class="col-sm-10">
                    <div class="form-check" >
                        <input class="form-check-input" type="radio" name="sectors" id="gridRadios1" value="IT" required>
                        <label class="form-check-label fw-bold" for="gridRadios1">
                            IT
                        </label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="sectors" id="gridRadios2" value="Marketing" required>
                        <label class="form-check-label fw-bold" for="gridRadios2">
                            Marketing
                        </label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="sectors" id="gridRadios2" value="Medical" required>
                        <label class="form-check-label fw-bold" for="gridRadios2">
                            Medical
                        </label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="sectors" id="gridRadios2" value="Finance" required>
                        <label class="form-check-label fw-bold" for="gridRadio2">
                            Finance
                        </label>
                    </div>
                </div>
            </fieldset>
            <form action="/file-upload" class="dropzone mt-5">
                <legend class="col-form-label col-sm-3 pt-0 fw-bold">Upload Your Resume</legend>
                <div class="fallback">
                    <input name="resume" type="file" multiple />
                </div>
            </form>
            <div></div>
            <button type="submit" class="btn btn-light mt-4">Submit</button>
        </form>
    </div>
    <script src="https://unpkg.com/dropzone@5/dist/min/dropzone.min.js"></script>
</body>

</html>
